server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 2g;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # the browser's own host (localhost:8080), so the API's DNS-rebinding check sees it
    proxy_buffering off;          # SSE progress streams
    proxy_read_timeout 1h;
  }

  # Editor CSP (spec row 27): no other site may frame the editor; the MG sandbox page is sandboxed however it is opened.
  location = /mg-sandbox.html { add_header Content-Security-Policy "sandbox allow-scripts; frame-ancestors 'self'" always; }
  location / {
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    try_files $uri /index.html;
  }
}
