name: captions-clone

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: captions
      POSTGRES_PASSWORD: captions
      POSTGRES_DB: captions
    ports: ["5433:5432"] # 5432 on this Mac is a Homebrew postgresql@18 service
    # In the SabiDev APFS image (same SSD): on the ExFAT DATA_DIR macOS adds ._ files the entrypoint can't chown, so a restart fails.
    volumes: ["${HOME}/SabiDev/docker/postgres:/var/lib/postgresql/data"]

  minio:
    image: cgr.dev/chainguard/minio:latest # minio/minio is gone from Docker Hub; Chainguard builds MinIO from source
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["${DATA_DIR}/minio:/data"]

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/Dockerfile, target: api }
    environment:
      DATABASE_URL: postgres://captions:captions@postgres:5432/captions
      API_BASE_URL: http://api:3001 # the render browser's URL for assets (inside the network; no outside page can send Host "api")
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      # AI workers run on the Mac host (Apple Silicon), not in Docker
      WHISPERX_URL: http://host.docker.internal:8010
      OLLAMA_URL: http://host.docker.internal:11434
      FAL_KEY: ${FAL_KEY}
      PEXELS_KEY: ${PEXELS_KEY}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    ports: ["3001:3001"]
    depends_on: [postgres, minio]

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      target: web
      args: # analytics is compiled into the web bundle; empty = off
        VITE_POSTHOG_KEY: ${VITE_POSTHOG_KEY:-}
        VITE_POSTHOG_HOST: ${VITE_POSTHOG_HOST:-}
    ports: ["8080:80"]
    depends_on: [api]
